<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bug Details</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
    <div class="container">
        {% include '_nav.html' %}
        <main class="main">
            <section class="table-panel detail-panel">
                <div class="detail-heading">
                    <a id="detail-back-link" href="/bug-check">Back to Bug Check</a>
                    <h1 id="detail-title">Bug Details</h1>
                </div>
                <div id="bug-detail-results"></div>
            </section>
        </main>
    </div>
    <script>window.BUG_TYPE = {{ bug_type | tojson }};</script>
    <script type="module" src="{{ url_for('static', filename='js/bug-detail.js') }}"></script>
    <script type="module" src="{{ url_for('static', filename='js/auth.js') }}"></script>
</body>

</html>
